<header class="bg-white/95 backdrop-blur-md border-b border-gray-200 sticky top-0 z-40 shadow-xs">

          <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">

        <a href="category.html?category=islamic-clothing" class="flex items-center gap-1.5 px-2.5 py-2 rounded-lg transition-colors hover:text-emerald-700 hover:bg-gray-50" data-nav-link="islamic-clothing">

        </a>

        <!-- 3. Modest Wear -->
        <a href="category.html?category=hijab-modest-wear" class="flex items-center gap-1.5 px-2.5 py-2 rounded-lg transition-colors hover:text-emerald-700 hover:bg-gray-50" data-nav-link="hijab-modest-wear">

        </a>

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />

          />
