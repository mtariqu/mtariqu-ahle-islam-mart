<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Support | Apna Mart</title>
    <meta name="description" content="Contact the Apna Mart team for inquiries and feedback." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- GLOBAL 0.5s PAGE LOADER OVERLAY -->
    <div id="global-page-loader" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center transition-opacity duration-300 pointer-events-none">
      <div class="flex flex-col items-center gap-3">
        <div class="relative w-12 h-12">
          <div class="w-12 h-12 rounded-full border-4 border-emerald-100 border-t-emerald-600 animate-spin"></div>
          <div class="absolute inset-0 flex items-center justify-center font-bold text-[10px] text-emerald-700">APNA</div>
        </div>
        <span class="text-xs font-semibold text-gray-500 tracking-wider animate-pulse">Loading...</span>
      </div>
    </div>
    <script>
      (function() {
        setTimeout(function() {
          var loader = document.getElementById('global-page-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(function() { loader.remove(); }, 300);
          }
        }, 500);
      })();
    </script>

    <!-- HEADER & NAVIGATION -->
    <div id="global-header"></div>

    <main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <div class="bg-white rounded-2xl border border-gray-200 p-8 sm:p-10 shadow-xs space-y-6">
        <div>
          <h1 class="text-2xl font-extrabold text-gray-900">Contact Us</h1>
          <p class="text-xs text-gray-500 mt-1">Have questions, feedback, or affiliate partnership requests? Send us a message.</p>
        </div>

        <div id="contact-alert" class="hidden p-3 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-medium"></div>

        <form id="contact-form" class="space-y-4">
          <div>
            <label for="contact-name" class="block text-xs font-bold text-gray-700 mb-1">Your Name *</label>
            <input 
              type="text" 
              id="contact-name" 
              required 
              minlength="2" 
              maxlength="100" 
              placeholder="e.g. Tariq Ahmad" 
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500" 
            />
          </div>

          <div>
            <label for="contact-email" class="block text-xs font-bold text-gray-700 mb-1">Email Address *</label>
            <input 
              type="email" 
              id="contact-email" 
              required 
              maxlength="100" 
              placeholder="you@example.com" 
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500" 
            />
          </div>

          <div>
            <label for="contact-phone" class="block text-xs font-bold text-gray-700 mb-1">Phone Number (Optional)</label>
            <input 
              type="tel" 
              id="contact-phone" 
              maxlength="20" 
              placeholder="+91 9876543210" 
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500" 
            />
          </div>

          <div>
            <label for="contact-subject" class="block text-xs font-bold text-gray-700 mb-1">Subject *</label>
            <input 
              type="text" 
              id="contact-subject" 
              required 
              minlength="3" 
              maxlength="200" 
              placeholder="Product query or general inquiry" 
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500" 
            />
          </div>

          <div>
            <label for="contact-message" class="block text-xs font-bold text-gray-700 mb-1">Message *</label>
            <textarea 
              id="contact-message" 
              rows="5" 
              required 
              minlength="10" 
              maxlength="2000" 
              placeholder="Type your message here..." 
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500"
            ></textarea>
          </div>

          <button 
            type="submit" 
            id="contact-submit-btn" 
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg text-sm transition-colors shadow-xs"
          >
            Send Message
          </button>
        </form>

        <div class="pt-6 border-t border-gray-100 text-xs text-gray-500 space-y-1">
          <p class="font-semibold text-gray-800">Support Hours:</p>
          <p>Monday – Friday: 9:00 AM – 6:00 PM (IST)</p>
          <p>Email: <a href="mailto:support@apnamart.com" class="font-mono text-emerald-600 hover:underline font-bold">support@apnamart.com</a></p>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <div id="global-footer"></div>

    <script type="module" src="/js/contact.js"></script>
    <script type="module" src="/js/components.js"></script>
</body>
</html>
