<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background container for luxury feel -->
  <rect x="2" y="2" width="396" height="96" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Brand Emblem Badge (Modern Shopping Bag / Storefront) -->
  <g transform="translate(18, 14)">
    <rect width="72" height="72" rx="14" fill="url(#emeraldGrad)" stroke="#10B981" stroke-width="1.5" />
    <!-- Shopping Bag Icon -->
    <path d="M26 24 C26 18.477 30.477 14 36 14 C41.523 14 46 18.477 46 24 M20 24 L52 24 L55 58 L17 58 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Star Accent -->
    <polygon points="36,34 38,39 43,39 39,42 41,47 36,44 31,47 33,42 29,39 34,39" fill="#FDE047" />
  </g>

  <!-- Typography -->
  <g transform="translate(106, 20)">
    <!-- Main Title -->
    <text x="0" y="32" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#065F46" letter-spacing="-0.5">APNA</text>
    <rect x="94" y="10" width="78" height="26" rx="6" fill="url(#goldGrad)" />
    <text x="133" y="28" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#18181B" text-anchor="middle" letter-spacing="1">MART</text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="54" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="1.5">SMART SHOPPING &amp; AFFILIATE DEALS</text>
  </g>
</svg>