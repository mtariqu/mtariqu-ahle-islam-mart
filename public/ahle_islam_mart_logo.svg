<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background container for luxury feel -->
  <rect x="2" y="2" width="396" height="96" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Brand Emblem Badge -->
  <g transform="translate(16, 14)">
    <rect width="72" height="72" rx="14" fill="url(#emeraldGrad)" stroke="#10B981" stroke-width="1.5" />
    <!-- Crescent & Star -->
    <path d="M36 14 A 22 22 0 1 0 54 48 A 18 18 0 1 1 36 14 Z" fill="url(#goldGrad)" />
    <!-- 8-Point Islamic Star -->
    <polygon points="48,22 50,27 55,27 51,30 53,35 48,32 43,35 45,30 41,27 46,27" fill="#FDE047" />
  </g>

  <!-- Typography -->
  <g transform="translate(102, 20)">
    <!-- Main Title -->
    <text x="0" y="32" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#065F46" letter-spacing="-0.5">AHLE E ISLAM</text>
    <rect x="165" y="12" width="74" height="24" rx="6" fill="url(#goldGrad)" />
    <text x="202" y="29" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#18181B" text-anchor="middle" letter-spacing="1">MART</text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="54" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="1.5">MODERN ISLAMIC LIFESTYLE &amp; ESSENTIALS</text>
  </g>
</svg>